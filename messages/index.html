<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wasm WebRTC PWA</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { font-family: system-ui, sans-serif; background: #121212; color: #e0e0e0; padding: 20px; text-align: center; }
    button { background: #007bff; color: #fff; border: none; padding: 10px 20px; margin: 5px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    button:disabled { background: #444; }
    #interactive-zone { display: flex; flex-direction: column; align-items: center; margin-top: 20px; }
    #reader { width: 300px; max-width: 100%; background: #000; border-radius: 8px; overflow: hidden; }
    canvas { background: white; padding: 10px; border-radius: 8px; margin-top: 15px; }
    pre { background: #1e1e1e; padding: 15px; border-radius: 5px; text-align: left; max-width: 400px; overflow-x: auto; }
  </style>
</head>
<body>

  <h1>Wasm WebRTC Offline Bridge</h1>
  
  <div>
    <button id="btn-initiate">1. Act as Initiator (Show Offer)</button>
    <button id="btn-scan">2. Open Camera (Scan Code)</button>
    <button id="btn-send" disabled>3. Send Rust Data P2P</button>
  </div>

  <div id="interactive-zone">
    <div id="reader" style="display: none;"></div>
    <canvas id="qr-canvas" style="display: none;"></canvas>
    <h3>Engine Output Status:</h3>
    <pre id="output">System Idle...</pre>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
