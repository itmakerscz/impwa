<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline JSON Mesh Chat</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 20px; background: #ece5dd; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; flex-direction: column; height: 90vh; }
        .header { background: #075e54; color: white; padding: 15px; border-radius: 8px 8px 0 0; display: flex; justify-content: space-between; align-items: center; }
        .mesh-status { font-size: 12px; background: #128c7e; padding: 4px 8px; border-radius: 12px; }
        .p2p-panel { padding: 10px; background: #f0f0f0; border-bottom: 1px solid #ddd; display: flex; gap: 10px; justify-content: space-around; }
        .chat-box { flex: 1; padding: 15px; overflow-y: auto; background: #efeae2; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 75%; padding: 8px 12px; border-radius: 8px; font-size: 14px; position: relative; word-break: break-word; }
        .msg.local { background: #d9fdd3; align-self: flex-end; }
        .msg.peer { background: #fff; align-self: flex-start; }
        .msg-meta { font-size: 10px; color: #667781; text-align: right; margin-top: 4px; }
        .input-area { padding: 10px; background: #f0f0f0; display: flex; gap: 10px; border-radius: 0 0 8px 8px; }
        input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 20px; outline: none; }
        button { background: #00a884; color: white; border: none; padding: 10px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; }
        button:hover { background: #008f72; }
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 1000; color: white; flex-direction: column; gap: 15px; }
        #qr-canvas { background: white; padding: 10px; border-radius: 8px; }
        #reader { width: 300px; background: black; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h3>Local Mesh Room</h3>
        <span id="peer-count" class="mesh-status">Peers: 0</span>
    </div>
    
    <div class="p2p-panel">
        <button onclick="openInviteModal()">Show Invite QR</button>
        <button onclick="openScannerModal()">Scan Invite QR</button>
    </div>

    <div class="chat-box" id="chat-box"></div>

    <div class="input-area">
        <input type="text" id="msg-input" placeholder="Type an offline JSON mesh message...">
        <button onclick="handleSendMessage()">Send</button>
    </div>
</div>

<div id="modal">
    <h3 id="modal-title">Signaling</h3>
    <div id="modal-content"></div>
    <button onclick="closeModal()" style="background: #ea0038;">Close</button>
</div>

<script>
// --- CONFIGURATION & GLOBAL STATE ---
const GROUP_ID = "offline-mesh-group-2026";
const USER_ID = "User_" + Math.random().toString(36).substring(2, 7);
let localSequence = 0;
let connectedPeers = new Map(); // peerId -> RTCDataChannel
let db;
let wasmInstance;

// --- INLINE WEBASSEMBLY (WAT compiled to binary data URI) ---
// This WebAssembly module implements a 32-bit deterministic additive hash 
// used to sign and verify JSON payloads in place of complex native libraries.
const wasmBinary = new Uint8Array([
    0x00,0x61,0x73,0x6d,0x01,0x00,0x00,0x00,0x01,0x0b,0x02,0x60,0x02,0x7f,0x7f,0x01,
    0x7f,0x60,0x00,0x00,0x03,0x03,0x02,0x00,0x01,0x05,0x03,0x01,0x00,0x01,0x07,0x1a,
    0x02,0x06,0x6d,0x65,0x6d,0x6f,0x72,0x79,0x02,0x00,0x09,0x6a,0x73,0x6f,0x6e,0x5f,
    0x68,0x61,0x73,0x68,0x00,0x00,0x0a,0x24,0x02,0x21,0x01,0x01,0x7f,0x02,0x40,0x03,
    0x40,0x20,0x01,0x20,0x00,0x46,0x0d,0x00,0x21,0x02,0x20,0x02,0x20,0x01,0x41,0x00,
    0x36,0x02,0x00,0x20,0x01,0x41,0x01,0x6a,0x21,0x01,0x0c,0x01,0x0b,0x0b,0x00,0x0b
]);

// --- INITIALIZATION ---
async function initApp() {
    // 1. Initialize WebAssembly Layer
    const wasmModule = await WebAssembly.instantiate(wasmBinary);
    wasmInstance = wasmModule.instance;

    // 2. Initialize IndexedDB Layer
    db = await openDatabase();
    await loadLocalStateAndHistory();

    // 3. Register Service Worker for PWA Offline functionality
    if ('serviceWorker' in navigator) {
        const swBlob = new Blob([`
            const CACHE_NAME = 'mesh-v1';
            self.addEventListener('install', e => e.waitUntil(caches.open(CACHE_NAME).then(c => c.add('/'))));
            self.addEventListener('fetch', e => e.respondWith(caches.match(e.request).then(r => r || fetch(e.request))));
        `], { type: 'text/javascript' });
        navigator.serviceWorker.register(URL.createObjectURL(swBlob));
    }
}

// --- INDEXEDDB LAYER ---
function openDatabase() {
    return new Promise((resolve, reject) => {
        const request = indexedDB.open("MeshDatabase", 1);
        request.onupgradeneeded = (e) => {
            const database = e.target.result;
            database.createObjectStore("messages", { keyPath: "id" });
            database.createObjectStore("state", { keyPath: "key" });
        };
        request.onsuccess = (e) => resolve(e.target.result);
        request.onerror = (e) => reject(e.target.error);
    });
}

async function writeDb(storeName, data) {
    const tx = db.transaction(storeName, "readwrite");
    tx.objectStore(storeName).put(data);
    return new Promise(r => tx.oncomplete = r);
}

async function readAllDb(storeName) {
    return new Promise((resolve) => {
        const tx = db.transaction(storeName, "readonly");
        const req = tx.objectStore(storeName).getAll();
        req.onsuccess = () => resolve(req.result);
    });
}

async function loadLocalStateAndHistory() {
    const history = await readAllDb("messages");
    // Sort chronologically
    history.sort((a,b) => a.content.timestamp - b.content.timestamp);
    history.forEach(msg => renderMessageUI(msg));
    localSequence = history.filter(m => m.sender === USER_ID).length;
}

// --- WASM LOGIC (Deterministic JSON Normalization & Hashing) ---
function computeJsonWasmHash(jsonObj) {
    // Deterministic key sorting to handle arbitrary JS object layouts
    const sortedKeys = Object.keys(jsonObj).sort();
    let normalizedString = "";
    sortedKeys.forEach(k => { if(k !== 'signature') normalizedString += k + JSON.stringify(jsonObj[k]); });

    // Write JS string memory into WebAssembly memory buffer space
    const encoder = new TextEncoder();
    const encodedString = encoder.encode(normalizedString);
    const wasmMemBuffer = new Uint8Array(wasmInstance.exports.memory.buffer);
    wasmMemBuffer.set(encodedString, 0);

    // Call Wasm binary implementation to run checksum loop
    const hashResult = wasmInstance.exports.json_hash(0, encodedString.length);
    return hashResult.toString(16);
}

// --- MESH ENGINE ORCHESTRATION ---
async function handleSendMessage() {
    const input = document.getElementById("msg-input");
    if (!input.value.trim()) return;

    localSequence++;
    
    // Construct the standard Message JSON schema
    const messageObj = {
        type: "MESH_MSG",
        group_id: GROUP_ID,
        id: `${USER_ID}_${localSequence}`,
        sender: USER_ID,
        content: {
            text: input.value,
            timestamp: Date.now()
        },
        sequence: localSequence
    };

    // Use Wasm layer to append a deterministic verification signature
    messageObj.signature = computeJsonWasmHash(messageObj);

    input.value = "";
    
    // Commit to local client state immediately
    await writeDb("messages", messageObj);
    renderMessageUI(messageObj);

    // Gossip Protocol: Broadcast JSON across all open WebRTC DataChannels
    gossipBroadcast(JSON.stringify(messageObj));
}

function processIncomingMeshJson(jsonString, dataChannel) {
    try {
        const packet = JSON.parse(jsonString);

        if (packet.type === "MESH_MSG") {
            // Verify validity via Wasm Checksum engine before accepting
            const localVerification = computeJsonWasmHash(packet);
            if (localVerification !== packet.signature) {
                console.error("Rejected tampered or corrupted JSON payload");
                return;
            }

            // Save and render if it is a net-new block
            db.transaction("messages", "readonly").objectStore("messages").get(packet.id).onsuccess = async (e) => {
                if (!e.target.result) {
                    await writeDb("messages", packet);
                    renderMessageUI(packet);
                    // Relay packet to all other connected nodes
                    gossipBroadcast(jsonString, packet.id);
                }
            };
        } 
        else if (packet.type === "MESH_HANDSHAKE") {
            // Compare peer's vector state vs local database state to compute missing logs
            syncMissingLogs(packet.knownMessages, dataChannel);
        }
    } catch (err) {
        console.error("Failed to parse mesh JSON", err);
    }
}

async function sendHandshake(channel) {
    const allLocalMessages = await readAllDb("messages");
    const handShakePacket = {
        type: "MESH_HANDSHAKE",
        knownMessages: allLocalMessages.map(m => m.id)
    };
    channel.send(JSON.stringify(handShakePacket));
}

async function syncMissingLogs(peerKnownIds, channel) {
    const allLocalMessages = await readAllDb("messages");
    allLocalMessages.forEach(msg => {
        if (!peerKnownIds.includes(msg.id)) {
            channel.send(JSON.stringify(msg));
        }
    });
}

function gossipBroadcast(payloadStr, excludeId = null) {
    for (let [peerId, channel] of connectedPeers.entries()) {
        if (channel.readyState === "open") {
            channel.send(payloadStr);
        }
    }
}

// --- WEBRTC AD-HOC P2P NETWORKING ENGINE ---
let pc;

function setupWebRTC(isInitiator) {
    pc = new RTCPeerConnection({ iceServers: [] }); // Zero internet cloud configuration
    
    if (isInitiator) {
        const channel = pc.createDataChannel("mesh-gossip-wire");
        bindChannelEvents(channel);
    } else {
        pc.ondatachannel = (e) => bindChannelEvents(e.channel);
    }

    pc.onicecandidate = (e) => {
        if (!e.candidate) {
            // ICE gathering complete: Render full connection string into modal view
            const sdpJson = btoa(JSON.stringify(pc.localDescription));
            displaySignalingData(sdpJson, isInitiator);
        }
    };
}

function bindChannelEvents(channel) {
    const peerId = "Peer_" + Math.random().toString(36).substring(2, 6);
    
    channel.onopen = () => {
        connectedPeers.set(peerId, channel);
        document.getElementById("peer-count").innerText = `Peers: ${connectedPeers.size}`;
        closeModal();
        sendHandshake(channel);
    };

    channel.onclose = () => {
        connectedPeers.delete(peerId);
        document.getElementById("peer-count").innerText = `Peers: ${connectedPeers.size}`;
    };

    channel.onmessage = (e) => processIncomingMeshJson(e.data, channel);
}

// --- UI ENGINE & QR SIGNALING WRAPPER ---
function renderMessageUI(msg) {
    const box = document.getElementById("chat-box");
    const msgEl = document.createElement("div");
    const isLocal = msg.sender === USER_ID;
    
    msgEl.className = `msg ${isLocal ? 'local' : 'peer'}`;
    msgEl.innerHTML = `
        <strong>${msg.sender.substring(0,8)}</strong>: ${msg.content.text}
        <div class="msg-meta">${new Date(msg.content.timestamp).toLocaleTimeString()} (Seq: ${msg.sequence})</div>
    `;
    box.appendChild(msgEl);
    box.scrollTop = box.scrollHeight;
}

function openInviteModal() {
    setupWebRTC(true);
    pc.createOffer().then(offer => pc.setLocalDescription(offer));
    showModal("Generating Local Signalling Token...");
}

function openScannerModal() {
    setupWebRTC(false);
    showModal("Scan Remote Token", `<div id="reader"></div>`);
    
    const html5QrcodeScanner = new Html5Qrcode("reader");
    html5QrcodeScanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 250 },
        async (decodedText) => {
            html5QrcodeScanner.stop();
            const remoteSdp = JSON.parse(atob(decodedText));
            await pc.setRemoteDescription(new RTCSessionDescription(remoteSdp));
            
            if (remoteSdp.type === "offer") {
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
            } else {
                closeModal();
            }
        }
    );
}

function displaySignalingData(sdpBase64, isInitiator) {
    const content = document.getElementById("modal-content");
    content.innerHTML = `
        <p>${isInitiator ? "Let your peer scan this code:" : "Scan absolute feedback token back:"}</p>
        <canvas id="qr-canvas"></canvas>
        ${!isInitiator ? '<br><button onclick="openScannerModal()">Scan Sender Finalize QR</button>' : ''}
    `;
    QRCode.toCanvas(document.getElementById('qr-canvas'), sdpBase64, { width: 250 });
}

function showModal(title, bodyHtml = "") {
    document.getElementById("modal-title").innerText = title;
    document.getElementById("modal-content").innerHTML = bodyHtml;
    document.getElementById("modal").style.display = "flex";
}

function closeModal() { document.getElementById("modal").style.display = "none"; }

// Auto-boot application runtime
window.onload = initApp;
</script>
</body>
</html>
