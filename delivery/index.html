<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#e67e22">
    <link rel="icon" href="data:,">
    <title>Scanner Účtenek</title>
    
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    
    <style>
        :root { --primary: #e67e22; --bg: #f4f7f6; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 15px; }
        .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 15px; }
        label { font-size: 0.75rem; color: #7f8c8d; font-weight: bold; text-transform: uppercase; }
        input { width: 100%; padding: 10px; margin: 4px 0 12px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 1rem; }
        .btn { border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; transition: opacity 0.2s; }
        .btn-main { background: var(--primary); color: white; margin-bottom: 10px; }
        .btn-save { background: #2ecc71; color: white; }
        .loading { text-align: center; color: var(--primary); padding: 10px; font-weight: bold; }
        .price-text { color: #27ae60; font-size: 1.2rem; font-weight: bold; }
        .actions { display: flex; gap: 8px; margin-top: 10px; }
        .btn-action { background: #eee; flex: 1; font-size: 0.85rem; color: #333; text-decoration: none; text-align: center; line-height: 2.5; border-radius: 6px; border: 1px solid #ccc; }
        .btn-waze { background: #33f0ff; border: none; color: black; font-weight: bold; }
        details { margin-top: 10px; font-size: 0.8rem; }
        .raw-box { background: #2c3e50; color: #bdc3c7; padding: 10px; border-radius: 6px; max-height: 150px; overflow-y: auto; font-family: monospace; }
    </style>
</head>
<body>
    <div id="app">
        <!-- Main Form -->
        <div class="card">
            <div v-if="loading" class="loading">⏳ Čtení účtenky...</div>
            <input type="file" ref="fileInput" accept="image/*" capture="environment" @change="onFileSelect" hidden>
            <button class="btn btn-main" @click="triggerCam">📷 Vyfotit Účtenku</button>
            
            <label>Telefon</label>
            <input v-model="form.phone" placeholder="+420...">
            
            <label>Adresa</label>
            <input v-model="form.address" placeholder="Ulice, Město">
            
            <label>Cena</label>
            <input v-model="form.price" placeholder="0,00 Kč">
            
            <button class="btn btn-save" @click="addItem">Uložit záznam</button>
        </div>

        <!-- Debug View -->
        <div class="card" v-if="rawLines.length > 0">
            <details>
                <summary>🔍 Zobrazit načtený text (řádek po řádku)</summary>
                <div class="raw-box">
                    <div v-for="(line, i) in rawLines" :key="i">
                        <span style="color:#7f8c8d">{{i}}:</span> {{line}}
                    </div>
                </div>
            </details>
        </div>

        <!-- List View -->
        <div v-for="item in items" :key="item.id" class="card">
            <div style="margin-bottom: 8px;">
                <strong>📍 {{ item.address || 'Neznámá adresa' }}</strong><br>
                <span class="price-text">{{ item.price }}</span>
            </div>
            <div class="actions">
                <a v-if="item.phone" class="btn btn-action" @click="callNum(item.phone)">📞 Volat</a>
                <button v-if="item.address" class="btn btn-action btn-waze" @click="navigate(item.address)">🚗 Waze</button>
            </div>
        </div>
    </div>
    <script type="module" src="app.js"></script>
</body>
</html>
