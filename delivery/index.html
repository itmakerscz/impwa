<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner: Debug Mode</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        :root { --accent: #e67e22; --success: #27ae60; --bg: #f4f4f9; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 10px; }
        #app { max-width: 480px; margin: 0 auto; }
        .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 10px; }
        input { width: 100%; padding: 12px; margin: 5px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        .btn { border: none; padding: 14px; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; font-size: 1rem; }
        .btn-scan { background: var(--accent); color: white; }
        .btn-save { background: var(--success); color: white; margin-top: 10px; }
        .loading { color: var(--accent); text-align: center; font-weight: bold; padding: 10px; }
        .item { border-left: 5px solid var(--accent); padding: 10px; margin-bottom: 10px; }
        .price-tag { color: var(--success); font-weight: bold; }
    </style>
</head>
<body>
    <div id="app">
        <div class="card">
            <div v-if="loading" class="loading">⏳ Čtu data (podívejte se do konzole)...</div>
            <input type="file" accept="image/*" capture="environment" @change="onFileSelect" id="cam" hidden>
            <button class="btn btn-scan" @click="triggerCam" :disabled="loading">📷 Naskenovat účtenku</button>
            
            <div style="margin-top: 10px;">
                <input v-model="form.phone" placeholder="Telefon">
                <input v-model="form.address" placeholder="Adresa">
                <input v-model="form.price" placeholder="Cena">
                <button class="btn btn-save" @click="addItem">Uložit záznam</button>
            </div>
        </div>

        <div v-for="item in items" :key="item.id" class="card item">
            <strong>📍 {{ item.address || 'Neznámá adresa' }}</strong><br>
            <span>📞 {{ item.phone || 'Bez telefonu' }}</span><br>
            <span class="price-tag">{{ item.price || '0,00 Kč' }}</span>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;

        const Extractor = {
            patterns: {
                phone: /(?i:tel)\s*[:.]?\s*(?:(?:\+|00)420[\s\/]*)?(\d{3})\s*(\d{3})\s*(\d{3})/,
                address: /[\w\s\.]{3,}\s\d{1,5}(?:\/\d{1,5})?,\s\d{3}\s\d{2}\s+[\w\s]{2,15}/,
                price: /(?:CELKEM|SUMA)\s*(?:KC)?\s*([\d\s]+,[\d]{2})/i
            },
            extract(text) {
                // Flattening text to help address regex cross line breaks
                // const clean = text.replace(/\n/g, ' ').replace(/\s+/g, ' ');
                
                const phMatch = text.match(this.patterns.phone);
                const adMatch = text.match(this.patterns.address);
                const prMatch = text.match(this.patterns.price);
                
                const data = {
                    phone: phMatch ? `${phMatch[1]}${phMatch[2]}${phMatch[3]}` : '',
                    address: adMatch ? adMatch[0].trim() : '',
                    price: prMatch ? prMatch[1].trim() + ' Kč' : ''
                };

                // DEBUG LOGS
                console.log("--- RAW OCR TEXT ---");
                console.log(text); 
                //console.log("--- CLEANED TEXT FOR REGEX ---");
                //console.log(clean);
                console.log("--- EXTRACTED DATA ---");
                console.log(data);

                return data;
            }
        };

        createApp({
            setup() {
                const loading = ref(false);
                const items = ref([]);
                const form = ref({ phone: '', address: '', price: '' });

                onMounted(() => {
                    const saved = localStorage.getItem('receipt_debug_v8');
                    if (saved) items.value = JSON.parse(saved);
                });

                const triggerCam = () => document.getElementById('cam').click();

                const onFileSelect = async (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    
                    loading.value = true;
                    const worker = await Tesseract.createWorker('ces');
                    
                    try {
                        const { data: { text } } = await worker.recognize(file);
                        const result = Extractor.extract(text);
                        
                        form.value.phone = result.phone;
                        form.value.address = result.address;
                        form.value.price = result.price;
                    } catch (err) {
                        console.error("OCR Error:", err);
                        alert("Chyba při čtení.");
                    } finally {
                        await worker.terminate();
                        loading.value = false;
                        e.target.value = ''; 
                    }
                };

                const addItem = () => {
                    items.value.unshift({ ...form.value, id: Date.now() });
                    localStorage.setItem('receipt_debug_v8', JSON.stringify(items.value));
                    form.value = { phone: '', address: '', price: '' };
                };

                return { loading, form, items, triggerCam, onFileSelect, addItem };
            }
        }).mount('#app');
    </script>
</body>
</html>
