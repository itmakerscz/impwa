<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regex Scanner Pro</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        :root { --accent: #e67e22; --bg: #f4f4f9; }
        body { font-family: system-ui, sans-serif; background: var(--bg); margin: 0; padding: 10px; }
        #app { max-width: 480px; margin: 0 auto; }
        .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 10px; }
        input { width: 100%; padding: 12px; margin: 5px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .btn { border: none; padding: 14px; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; }
        .btn-scan { background: var(--accent); color: white; }
        .btn-save { background: #27ae60; color: white; margin-top: 10px; }
        .item { border-left: 4px solid var(--accent); margin-bottom: 8px; font-size: 0.9rem; }
        .loading { color: var(--accent); text-align: center; font-weight: bold; padding: 10px; }
        .action-row { display: flex; gap: 8px; margin-top: 10px; }
        .action-row a { flex: 1; text-align: center; background: #eee; padding: 8px; border-radius: 6px; text-decoration: none; color: #333; font-weight: bold; }
    </style>
</head>
<body>
    <div id="app">
        <div class="card">
            <div v-if="loading" class="loading">⏳ Analyzuji text...</div>
            <input type="file" accept="image/*" capture="environment" @change="onFileSelect" id="cam" hidden>
            <button class="btn btn-scan" @click="triggerCam" :disabled="loading">Naskenovat telefon a adresu</button>
            
            <div style="margin-top: 10px;">
                <input v-model="form.phone" placeholder="Telefon">
                <input v-model="form.address" placeholder="Adresa">
                <button class="btn btn-save" @click="addItem">Uložit do historie</button>
            </div>
        </div>

        <input v-model="filter" placeholder="🔍 Hledat v uložených..." style="border: 2px solid var(--accent); margin-bottom: 10px;">

        <div v-for="item in filteredList" :key="item.id" class="card item">
            <div style="display: flex; justify-content: space-between;">
                <strong>📍 {{ item.address || 'Adresa nenalezena' }}</strong>
                <button @click="removeItem(item.id)" style="border:none; background:none; color:red;">Smazat</button>
            </div>
            <div>📞 {{ item.phone || 'Telefon nenalezen' }}</div>
            <div class="action-row">
                <a v-if="item.phone" :href="'tel:' + item.phone">Zavolat</a>
                <a v-if="item.address" :href="wazeLink(item.address)" target="_blank">Waze</a>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, computed, onMounted } = Vue;

        // --- REGEX SERVICE ---
        const Extractor = {
            // Your exact patterns
            patterns: {
                phone: /(?i:tel)\s*[:.]?\s*(?:(?:\+|00)420[\s\/]*)?(\d{3})\s*(\d{3})\s*(\d{3})/,
                address: /[\w\s\.]{3,}\s\d{1,5}(?:\/\d{1,5})?,\s\d{3}\s\d{2}\s+[\w\s]{2,15}/
            },
            extract(text) {
                const phMatch = text.match(this.patterns.phone);
                const adMatch = text.match(this.patterns.address);
                
                return {
                    // Joins the 3 capture groups from your phone regex
                    phone: phMatch ? `${phMatch[1]}${phMatch[2]}${phMatch[3]}` : '',
                    address: adMatch ? adMatch[0].trim() : ''
                };
            }
        };

        createApp({
            setup() {
                const loading = ref(false);
                const filter = ref('');
                const items = ref([]);
                const form = ref({ phone: '', address: '' });

                onMounted(() => {
                    const saved = localStorage.getItem('regex_pwa_v6');
                    if (saved) items.value = JSON.parse(saved);
                });

                const triggerCam = () => document.getElementById('cam').click();

                const onFileSelect = async (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    
                    loading.value = true;
                    const worker = await Tesseract.createWorker('ces');
                    
                    try {
                        const { data: { text } } = await worker.recognize(file);
                        const result = Extractor.extract(text);
                        
                        form.value.phone = result.phone;
                        form.value.address = result.address;
                    } catch (err) {
                        alert("OCR selhalo.");
                    } finally {
                        await worker.terminate();
                        loading.value = false;
                        e.target.value = ''; 
                    }
                };

                const addItem = () => {
                    if (!form.value.phone && !form.value.address) return;
                    items.value.unshift({ ...form.value, id: Date.now() });
                    localStorage.setItem('regex_pwa_v6', JSON.stringify(items.value));
                    form.value = { phone: '', address: '' };
                };

                const filteredList = computed(() => {
                    const q = filter.value.toLowerCase();
                    return items.value.filter(i => 
                        i.phone.includes(q) || i.address.toLowerCase().includes(q)
                    );
                });

                return { 
                    loading, form, filter, filteredList, triggerCam, onFileSelect, addItem,
                    removeItem: (id) => {
                        items.value = items.value.filter(i => i.id !== id);
                        localStorage.setItem('regex_pwa_v6', JSON.stringify(items.value));
                    },
                    wazeLink: (addr) => `https://waze.com/ul?q=${encodeURIComponent(addr)}&navigate=yes`,
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
