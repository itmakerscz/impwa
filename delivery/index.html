<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner: Kontakty a Účtenky</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        :root { --accent: #e67e22; --success: #27ae60; --bg: #f4f4f9; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 10px; }
        #app { max-width: 480px; margin: 0 auto; }
        .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 10px; }
        input { width: 100%; padding: 12px; margin: 5px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        .btn { border: none; padding: 14px; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; font-size: 1rem; }
        .btn-scan { background: var(--accent); color: white; }
        .btn-save { background: var(--success); color: white; margin-top: 10px; }
        .loading { color: var(--accent); text-align: center; font-weight: bold; padding: 10px; }
        .item { border-left: 5px solid var(--accent); }
        .price-tag { color: var(--success); font-weight: bold; font-size: 1.1rem; }
        .action-row { display: flex; gap: 8px; margin-top: 12px; }
        .action-row a { flex: 1; text-align: center; background: #eee; padding: 10px; border-radius: 6px; text-decoration: none; color: #333; font-weight: bold; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div id="app">
        <div class="card">
            <div v-if="loading" class="loading">⏳ Čtu data z účtenky...</div>
            <input type="file" accept="image/*" capture="environment" @change="onFileSelect" id="cam" hidden>
            <button class="btn btn-scan" @click="triggerCam" :disabled="loading">📷 Naskenovat účtenku</button>
            
            <div style="margin-top: 10px;">
                <input v-model="form.phone" placeholder="Telefon">
                <input v-model="form.address" placeholder="Adresa">
                <input v-model="form.price" placeholder="Cena (CELKEM)">
                <button class="btn btn-save" @click="addItem" :disabled="!form.phone && !form.address && !form.price">Uložit záznam</button>
            </div>
        </div>

        <input v-model="filter" placeholder="🔍 Vyhledat v historii..." style="border: 2px solid var(--accent); margin-bottom: 15px;">

        <div v-for="item in filteredList" :key="item.id" class="card item">
            <div style="display: flex; justify-content: space-between; align-items: start;">
                <div>
                    <strong v-if="item.address">📍 {{ item.address }}</strong>
                    <div v-if="item.phone">📞 {{ item.phone }}</div>
                </div>
                <button @click="removeItem(item.id)" style="border:none; background:none; color:red; cursor:pointer;">❌</button>
            </div>
            <div v-if="item.price" class="price-tag">{{ item.price }}</div>
            
            <div class="action-row">
                <a v-if="item.phone" :href="'tel:' + item.phone">Zavolat</a>
                <a v-if="item.address" :href="wazeLink(item.address)" target="_blank">Waze</a>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, computed, onMounted } = Vue;

        const Extractor = {
            patterns: {
                // Phone regex using your capture groups
                phone: /(?i:tel)\s*[:.]?\s*(?:(?:\+|00)420[\s\/]*)?(\d{3})\s*(\d{3})\s*(\d{3})/,
                // Address regex for Czech format
                address: /[\w\s\.]{3,}\s\d{1,5}(?:\/\d{1,5})?,\s\d{3}\s\d{2}\s+[\w\s]{2,15}/,
                // Price regex specifically for "CELKEM" line on receipts
                price: /(?:CELKEM|SUMA)\s*(?:KC)?\s*([\d\s]+,[\d]{2})/i
            },
            extract(text) {
                // Normalize text to single spaces to help regex consistency
                const clean = text.replace(/\s+/g, ' ');
                const phMatch = text.match(this.patterns.phone);
                const adMatch = text.match(this.patterns.address);
                const prMatch = text.match(this.patterns.price);
                
                return {
                    phone: phMatch ? `${phMatch[1]}${phMatch[2]}${phMatch[3]}` : '',
                    address: adMatch ? adMatch[0].trim() : '',
                    price: prMatch ? prMatch[1].trim() + ' Kč' : ''
                };
            }
        };

        createApp({
            setup() {
                const loading = ref(false);
                const filter = ref('');
                const items = ref([]);
                const form = ref({ phone: '', address: '', price: '' });

                onMounted(() => {
                    const saved = localStorage.getItem('receipt_data_v7');
                    if (saved) items.value = JSON.parse(saved);
                });

                const triggerCam = () => document.getElementById('cam').click();

                const onFileSelect = async (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    
                    loading.value = true;
                    // Memory safety: fresh worker per scan
                    const worker = await Tesseract.createWorker('ces');
                    
                    try {
                        const { data: { text } } = await worker.recognize(file);
                        const result = Extractor.extract(text);
                        
                        form.value.phone = result.phone;
                        form.value.address = result.address;
                        form.value.price = result.price;
                    } catch (err) {
                        alert("Chyba při čtení účtenky.");
                    } finally {
                        await worker.terminate();
                        loading.value = false;
                        e.target.value = ''; 
                    }
                };

                const addItem = () => {
                    items.value.unshift({ ...form.value, id: Date.now() });
                    localStorage.setItem('receipt_data_v7', JSON.stringify(items.value));
                    form.value = { phone: '', address: '', price: '' };
                };

                const filteredList = computed(() => {
                    const q = filter.value.toLowerCase();
                    return items.value.filter(i => 
                        (i.phone && i.phone.includes(q)) || 
                        (i.address && i.address.toLowerCase().includes(q)) ||
                        (i.price && i.price.includes(q))
                    );
                });

                return { 
                    loading, form, filter, filteredList, triggerCam, onFileSelect, addItem,
                    removeItem: (id) => {
                        items.value = items.value.filter(i => i.id !== id);
                        localStorage.setItem('receipt_data_v7', JSON.stringify(items.value));
                    },
                    wazeLink: (addr) => `https://waze.com/ul?q=${encodeURIComponent(addr)}&navigate=yes`,
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
