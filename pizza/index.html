<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ultra-Performance Hlasový Zápisník</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4F46E5">
  <style>
    body { 
      font-family: system-ui, -apple-system, sans-serif; 
      background: #f3f4f6; 
      margin: 0; 
      padding: 20px; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      content-visibility: auto; /* Browser optimization for structural rendering */
    }
    .card { 
      background: white; 
      padding: 24px; 
      border-radius: 12px; 
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); 
      width: 100%; 
      max-width: 500px; 
      text-align: center; 
    }
    h2 { margin-top: 0; color: #1f2937; }
    
    /* Optimized output window using a scrollable contenteditable surface */
    .output-panel { 
      width: 100%; 
      height: 240px; 
      margin: 16px 0; 
      border: 1px solid #d1d5db; 
      border-radius: 8px; 
      padding: 12px; 
      box-sizing: border-box; 
      font-size: 16px; 
      overflow-y: auto;
      text-align: left;
      background: #fafafa;
      white-space: pre-wrap;
      word-wrap: break-word;
      contain: content; /* Isolates layout changes purely to this box */
    }
    .output-panel:focus { outline: 2px solid #4f46e5; background: white; }
    .interim { color: #9ca3af; font-style: italic; }
    
    button { 
      background: #4f46e5; color: white; border: none; padding: 14px 28px; 
      font-size: 16px; border-radius: 9999px; cursor: pointer; font-weight: bold; 
      transition: background 0.2s; width: 100%; will-change: transform;
    }
    button.recording { background: #ef4444; }
    .status { font-size: 14px; color: #6b7280; height: 20px; margin-bottom: 8px; font-weight: 500; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Hlasový Zápisník</h2>
    <div id="status" class="status">Připraveno ke spuštění...</div>
    <div id="textbox" class="output-panel" contenteditable="true" placeholder="Zde se objeví váš text..."></div>
    <button id="actionBtn">Spustit nahrávání</button>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }

    const SpeechRecognition = window.webkitSpeechRecognition || window.SpeechRecognition;
    
    if (!SpeechRecognition) {
      document.getElementById('status').innerText = "Web Speech API nepodporováno.";
      document.getElementById('actionBtn').disabled = true;
    } else {
      const recognition = new SpeechRecognition();
      recognition.continuous = true; 
      recognition.interimResults = true; 
      recognition.lang = 'cs-CZ'; 

      const actionBtn = document.getElementById('actionBtn');
      const textbox = document.getElementById('textbox');
      const status = document.getElementById('status');
      
      let shouldBeRecording = false;
      let wakeLock = null; 
      
      // Efficient structural collections for textual components
      let committedParagraphs = []; 
      let processedSpeechIds = new Set(); 
      let renderPending = false;

      async function requestWakeLock() {
        if ('wakeLock' in navigator && !wakeLock) {
          try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
        }
      }

      function releaseWakeLock() {
        if (wakeLock) { wakeLock.release().then(() => { wakeLock = null; }); }
      }

      recognition.onstart = async () => {
        status.innerText = "Poslouchám (cs-CZ)...";
        status.style.color = "#10b981";
        actionBtn.innerText = "Zastavit nahrávání";
        actionBtn.classList.add('recording');
        await requestWakeLock();
      };

      recognition.onend = () => {
        if (shouldBeRecording) {
          try { recognition.start(); } catch (err) {}
        } else {
          status.innerText = "Nahrávání zastaveno.";
          status.style.color = "#6b7280";
          actionBtn.innerText = "Spustit nahrávání";
          actionBtn.classList.remove('recording');
          releaseWakeLock();
          processedSpeechIds.clear();
        }
      };

      // HIGH PERFORMANCE TRANSCRIPTION PARSER
      recognition.onresult = (event) => {
        let interimTranscript = '';
        let allocationEngineId = event.resultIndex;

        // Process final packages safely via integer indices instead of heavy string comparisons
        for (let i = allocationEngineId; i < event.results.length; ++i) {
          const resultChunk = event.results[i];
          const textSnippet = resultChunk[0].transcript;

          if (resultChunk.isFinal) {
            // Unique execution tag generation
            const structuralSignature = `${event.resultIndex}-${i}-${textSnippet.trim().substring(0,5)}`;
            
            if (!processedSpeechIds.has(structuralSignature)) {
              processedSpeechIds.add(structuralSignature);
              committedParagraphs.push(textSnippet.trim());
            }
          } else {
            interimTranscript += textSnippet;
          }
        }

        // BATCH RENDERING PROCESS: Uses requestAnimationFrame to isolate processing threads 
        if (!renderPending) {
          renderPending = true;
          requestAnimationFrame(() => {
            const finalAssembledText = committedParagraphs.join(' ');
            
            if (interimTranscript) {
              // Direct innerHTML pipeline structure optimizing temporary tokens
              textbox.innerHTML = finalAssembledText + (finalAssembledText ? ' ' : '') + `<span class="interim">${interimTranscript}</span>`;
            } else {
              textbox.innerText = finalAssembledText + (finalAssembledText ? ' ' : '');
            }

            // Debounced scroll viewport constraint matching
            textbox.scrollTop = textbox.scrollHeight;
            renderPending = false;
          });
        }
      };

      actionBtn.addEventListener('click', () => {
        if (!shouldBeRecording) {
          shouldBeRecording = true;
          processedSpeechIds.clear();
          
          // Seed the array cache with whatever data is current inside the workspace element
          const initialCleanText = textbox.innerText.trim();
          committedParagraphs = initialCleanText ? [initialCleanText] : [];
          
          recognition.start();
        } else {
          shouldBeRecording = false; 
          recognition.stop();
        }
      });
    }
  </script>
</body>
</html>
