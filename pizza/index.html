<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VoiceNote PWA</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4F46E5">
  <style>
    body { font-family: system-ui, sans-serif; background: #f3f4f6; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
    .card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); width: 100%; max-width: 500px; text-align: center; }
    textarea { width: 100%; height: 200px; margin: 16px 0; border: 1px solid #d1d5db; border-radius: 8px; padding: 12px; box-sizing: border-box; font-size: 16px; resize: none; }
    button { background: #4f46e5; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 9999px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
    button.recording { background: #ef4444; }
    .status { font-size: 14px; color: #6b7280; height: 20px; margin-bottom: 8px; }
  </style>
</head>
<body>

  <div class="card">
    <h2>VoiceNote PWA</h2>
    <div id="status" class="status">Click start to dictate...</div>
    <textarea id="textbox" placeholder="Your speech will appear here..."></textarea>
    <button id="actionBtn">Start Recording</button>
  </div>

  <script>
    // Register the Service Worker for PWA compliance
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(err => console.error("SW failed", err));
    }

    // Speech Recognition Logic
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    
    if (!SpeechRecognition) {
      document.getElementById('status').innerText = "Web Speech API not supported in this browser.";
      document.getElementById('actionBtn').disabled = true;
    } else {
      const recognition = new SpeechRecognition();
      recognition.continuous = true; // Keep listening even if user pauses
      recognition.interimResults = true; // Show text *while* speaking
      recognition.lang = 'en-US';

      const actionBtn = document.getElementById('actionBtn');
      const textbox = document.getElementById('textbox');
      const status = document.getElementById('status');
      let isRecording = false;

      recognition.onstart = () => {
        status.innerText = "Listening actively...";
        actionBtn.innerText = "Stop Recording";
        actionBtn.classList.add('recording');
      };

      recognition.onerror = (e) => {
        status.innerText = `Error: ${e.error}`;
        stopListening();
      };

      recognition.onend = () => {
        status.innerText = "Stopped listening.";
        stopListening();
      };

      recognition.onresult = (event) => {
        let interimTranscript = '';
        let finalTranscript = '';

        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            finalTranscript += event.results[i][0].transcript;
          } else {
            interimTranscript += event.results[i][0].transcript;
          }
        }
        // Append final results to the textbox
        if (finalTranscript) textbox.value += finalTranscript + ' ';
      };

      function stopListening() {
        recognition.stop();
        isRecording = false;
        actionBtn.innerText = "Start Recording";
        actionBtn.classList.remove('recording');
      }

      actionBtn.addEventListener('click', () => {
        if (!isRecording) {
          recognition.start();
          isRecording = true;
        } else {
          stopListening();
        }
      });
    }
  </script>
</body>
</html>
