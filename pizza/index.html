<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ultra-Performance Hlasový Zápisník</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4F46E5">
  <style>
    body { 
      font-family: system-ui, -apple-system, sans-serif; 
      background: #f3f4f6; 
      margin: 0; 
      padding: 20px; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      content-visibility: auto; 
    }
    .card { 
      background: white; 
      padding: 24px; 
      border-radius: 12px; 
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); 
      width: 100%; 
      max-width: 500px; 
      text-align: center; 
    }
    h2 { margin-top: 0; color: #1f2937; }
    
    .output-panel { 
      width: 100%; 
      height: 240px; 
      margin: 16px 0; 
      border: 1px solid #d1d5db; 
      border-radius: 8px; 
      padding: 12px; 
      box-sizing: border-box; 
      font-size: 16px; 
      overflow-y: auto;
      text-align: left;
      background: #fafafa;
      white-space: pre-wrap;
      word-wrap: break-word;
      contain: content; 
    }
    .output-panel:focus { outline: 2px solid #4f46e5; background: white; }
    
    /* Native placeholder support for contenteditable panels */
    .output-panel:empty::before {
      content: attr(placeholder);
      color: #9ca3af;
      pointer-events: none;
    }
    
    .interim { color: #9ca3af; font-style: italic; }
    
    button { 
      background: #4f46e5; color: white; border: none; padding: 14px 28px; 
      font-size: 16px; border-radius: 9999px; cursor: pointer; font-weight: bold; 
      transition: background 0.2s; width: 100%; will-change: transform;
    }
    button.recording { background: #ef4444; }
    .status { font-size: 14px; color: #6b7280; height: 20px; margin-bottom: 8px; font-weight: 500; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Hlasový Zápisník</h2>
    <div id="status" class="status">Připraveno ke spuštění...</div>
    <div id="textbox" class="output-panel" contenteditable="true" placeholder="Zde se objeví váš text..."><span id="committedText"></span><span id="interimText" class="interim" contenteditable="false"></span></div>
    <button id="actionBtn">Spustit nahrávání</button>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }

    const SpeechRecognition = window.webkitSpeechRecognition || window.SpeechRecognition;
    
    if (!SpeechRecognition) {
      document.getElementById('status').innerText = "Web Speech API nepodporováno.";
      document.getElementById('actionBtn').disabled = true;
    } else {
      let recognition = null;
      const actionBtn = document.getElementById('actionBtn');
      const textbox = document.getElementById('textbox');
      const committedSpan = document.getElementById('committedText');
      const interimSpan = document.getElementById('interimText');
      const status = document.getElementById('status');
      
      let shouldBeRecording = false;
      let wakeLock = null; 
      let committedParagraphs = []; 
      let renderPending = false;

      // Helper logic to clear out canvas and data properties systematically
      function resetCanvas() {
        committedParagraphs = [];
        committedSpan.innerText = "";
        interimSpan.innerText = "";
        textbox.scrollTop = 0;
      }

      // LocalStorage engine to securely pack order logs down
      function saveOrderToStorage(textPayload) {
        if (!textPayload.trim()) return false;
        
        try {
          // Pull existing logs list, parse them, or start a clean container array
          const historicalData = localStorage.getItem('objednavky');
          const ordersList = historicalData ? JSON.parse(historicalData) : [];
          
          // Generate an indexable data block object
          const newOrderEntry = {
            id: crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36),
            timestamp: new Date().toISOString(),
            text: textPayload
          };
          
          ordersList.push(newOrderEntry);
          localStorage.setItem('objednavky', JSON.stringify(ordersList));
          console.log("Order saved safely to localStorage:", newOrderEntry);
          return true;
        } catch (error) {
          console.error("Storage write error:", error);
          return false;
        }
      }

      function initRecognition() {
        recognition = new SpeechRecognition();
        recognition.continuous = true; 
        recognition.interimResults = true; 
        recognition.lang = 'cs-CZ'; 

        recognition.onstart = async () => {
          status.innerText = "Poslouchám (cs-CZ)...";
          status.style.color = "#10b981";
          actionBtn.innerText = "Zastavit nahrávání";
          actionBtn.classList.add('recording');
          await requestWakeLock();
        };

        recognition.onend = () => {
          if (shouldBeRecording) {
            console.log("Stream dropped by browser timeout. Reinforcing listener loop...");
            try {
              initRecognition();
              recognition.start();
            } catch (err) {
              setTimeout(() => { if (shouldBeRecording) recognition.start(); }, 300);
            }
          } else {
            status.innerText = "Nahrávání zastaveno.";
            status.style.color = "#6b7280";
            actionBtn.innerText = "Spustit nahrávání";
            actionBtn.classList.remove('recording');
            releaseWakeLock();
            interimSpan.innerText = ""; 
          }
        };

        recognition.onresult = (event) => {
          let interimTranscript = '';
          let startIdx = event.resultIndex;

          for (let i = startIdx; i < event.results.length; ++i) {
            const resultChunk = event.results[i];
            
            if (resultChunk[0].confidence === 0 && resultChunk.isFinal) {
              continue;
            }

            const textSnippet = resultChunk[0].transcript.trim();

            if (resultChunk.isFinal && textSnippet) {
              const cleanSnippet = textSnippet.toLowerCase().replace(/[\s.,\/#!$%\^&\*;:{}=\-_`~()]/g,"");
              
              // MACRO 1: CLEAR SCREEN ("nová objednávka")
              if (cleanSnippet === "nováobjednávka") {
                status.innerText = "Nová objednávka inicializována...";
                status.style.color = "#3b82f6";
                resetCanvas();
                interimTranscript = "";
                continue; 
              }

              // MACRO 2: SAVE DATA ("uložit objednávku")
              if (cleanSnippet === "uložitobjednávku") {
                const finalAssembledText = committedParagraphs.join(' ').trim();
                
                if (finalAssembledText) {
                  const wasSaved = saveOrderToStorage(finalAssembledText);
                  if (wasSaved) {
                    status.innerText = "Objednávka byla úspěšně uložena! ✔";
                    status.style.color = "#10b981";
                  } else {
                    status.innerText = "Chyba při ukládání do paměti.";
                    status.style.color = "#ef4444";
                  }
                } else {
                  status.innerText = "Nelze uložit prázdný text.";
                  status.style.color = "#f59e0b";
                }
                
                resetCanvas();
                interimTranscript = "";
                continue;
              }

              // Normal Anti-Duplication Filtering
              let isGhostDuplicate = false;
              const lookbackWindow = committedParagraphs.slice(-3); 
              
              for (let pastSentence of lookbackWindow) {
                if (getSimilarity(pastSentence, textSnippet) > 0.85) {
                  isGhostDuplicate = true;
                  break;
                }
              }

              if (!isGhostDuplicate) {
                committedParagraphs.push(textSnippet);
              } else {
                console.warn("Blocked Browser Ghost Duplicate: ", textSnippet);
              }
            } else if (!resultChunk.isFinal) {
              const liveCleanInterim = resultChunk[0].transcript.toLowerCase().replace(/[\s.,\/#!$%\^&\*;:{}=\-_`~()]/g,"");
              if (liveCleanInterim === "nováobjednávka" || liveCleanInterim === "uložitobjednávku") {
                interimTranscript = "";
                continue;
              }
              interimTranscript += resultChunk[0].transcript;
            }
          }

          if (!renderPending) {
            renderPending = true;
            requestAnimationFrame(() => {
              const finalAssembledText = committedParagraphs.join(' ');
              committedSpan.innerText = finalAssembledText + (finalAssembledText ? ' ' : '');
              interimSpan.innerText = interimTranscript;
              textbox.scrollTop = textbox.scrollHeight;
              renderPending = false;
              
              // Safely step status message back down into base recording view after a notice delay
              if (shouldBeRecording && (status.innerText.includes("Nová") || status.innerText.includes("uložena") || status.innerText.includes("Nelze") || status.innerText.includes("Chyba"))) {
                setTimeout(() => {
                  if (shouldBeRecording) {
                    status.innerText = "Poslouchám (cs-CZ)...";
                    status.style.color = "#10b981";
                  }
                }, 2000);
              }
            });
          }
        };
        
        recognition.onerror = (event) => {
          console.error("Speech Recognition System Error:", event.error);
          if (event.error === 'no-speech') return;
        };
      }

      async function requestWakeLock() {
        if ('wakeLock' in navigator && !wakeLock) {
          try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
        }
      }

      function releaseWakeLock() {
        if (wakeLock) { 
          wakeLock.release().then(() => { wakeLock = null; }); 
        }
      }

      document.addEventListener('visibilitychange', async () => {
        if (wakeLock !== null && document.visibilityState === 'visible' && shouldBeRecording) {
          await requestWakeLock();
        }
      });

      function getSimilarity(str1, str2) {
        const s1 = str1.toLowerCase().replace(/[\s.,\/#!$%\^&\*;:{}=\-_`~()]/g,"");
        const s2 = str2.toLowerCase().replace(/[\s.,\/#!$%\^&\*;:{}=\-_`~()]/g,"");
        if (s1 === s2) return 1.0;
        if (!s1 || !s2) return 0.0;
        if (s1.includes(s2) && s1.length < s2.length + 5) return 0.9;
        if (s2.includes(s1) && s2.length < s1.length + 5) return 0.9;
        return 0.0;
      }

      initRecognition();

      actionBtn.addEventListener('click', () => {
        if (!shouldBeRecording) {
          shouldBeRecording = true;
          
          const initialCleanText = committedSpan.innerText.trim() || textbox.innerText.replace(interimSpan.innerText, "").trim();
          if (initialCleanText) {
            committedParagraphs = [initialCleanText];
          } else {
            committedParagraphs = [];
          }
          
          recognition.start();
        } else {
          shouldBeRecording = false; 
          recognition.stop();
        }
      });
    }
  </script>
</body>
</html>
