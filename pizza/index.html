<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ultra-Performance Hlasový Zápisník</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4F46E5">
  <style>
    body { 
      font-family: system-ui, -apple-system, sans-serif; 
      background: #f3f4f6; 
      margin: 0; 
      padding: 20px; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      content-visibility: auto; 
    }
    .card { 
      background: white; 
      padding: 24px; 
      border-radius: 12px; 
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); 
      width: 100%; 
      max-width: 500px; 
      text-align: center; 
      margin-bottom: 20px;
    }
    h2 { margin-top: 0; color: #1f2937; }
    
    .output-panel { 
      width: 100%; 
      height: 240px; 
      margin: 16px 0; 
      border: 1px solid #d1d5db; 
      border-radius: 8px; 
      padding: 12px; 
      box-sizing: border-box; 
      font-size: 16px; 
      overflow-y: auto;
      text-align: left;
      background: #fafafa;
      white-space: pre-wrap;
      word-wrap: break-word;
      contain: content; 
    }
    .output-panel:focus { outline: 2px solid #4f46e5; background: white; }
    
    .output-panel:empty::before {
      content: attr(placeholder);
      color: #9ca3af;
      pointer-events: none;
    }
    
    .interim { color: #9ca3af; font-style: italic; }
    
    button { 
      background: #4f46e5; color: white; border: none; padding: 14px 28px; 
      font-size: 16px; border-radius: 9999px; cursor: pointer; font-weight: bold; 
      transition: background 0.2s; width: 100%; will-change: transform;
    }
    button.recording { background: #ef4444; }
    .status { font-size: 14px; color: #6b7280; height: 20px; margin-bottom: 8px; font-weight: 500; }

    /* New CSS styling for the History Box container */
    .history-card {
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); 
      width: 100%;
      max-width: 500px;
      box-sizing: border-box;
    }
    .history-card h3 { margin-top: 0; color: #374151; font-size: 18px; text-align: left; border-bottom: 2px solid #f3f4f6; padding-bottom: 8px;}
    .orders-log { max-height: 300px; overflow-y: auto; text-align: left; }
    .order-item {
      background: #f9fafb;
      border-left: 4px solid #4f46e5;
      padding: 10px 12px;
      margin-bottom: 8px;
      border-radius: 0 6px 6px 0;
      font-size: 14px;
    }
    .order-meta { font-size: 11px; color: #9ca3af; margin-bottom: 4px; display: flex; justify-content: space-between; }
    .order-text { color: #1f2937; line-height: 1.4; }
    .no-orders { color: #9ca3af; text-align: center; font-size: 14px; padding: 20px 0; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Hlasový Zápisník</h2>
    <div id="status" class="status">Připraveno ke spuštění...</div>
    <div id="textbox" class="output-panel" contenteditable="true" placeholder="Zde se objeví váš text..."><span id="committedText"></span><span id="interimText" class="interim" contenteditable="false"></span></div>
    <button id="actionBtn">Spustit nahrávání</button>
  </div>

  <!-- Real-time orders viewing window container -->
  <div class="history-card">
    <h3>Uložené objednávky</h3>
    <div id="ordersLog" class="orders-log">
      <div class="no-orders">Žádné uložené objednávky.</div>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }

    const SpeechRecognition = window.webkitSpeechRecognition || window.SpeechRecognition;
    
    if (!SpeechRecognition) {
      document.getElementById('status').innerText = "Web Speech API nepodporováno.";
      document.getElementById('actionBtn').disabled = true;
    } else {
      let recognition = null;
      const actionBtn = document.getElementById('actionBtn');
      const textbox = document.getElementById('textbox');
      const committedSpan = document.getElementById('committedText');
      const interimSpan = document.getElementById('interimText');
      const status = document.getElementById('status');
      const ordersLog = document.getElementById('ordersLog');
      
      let shouldBeRecording = false;
      let wakeLock = null; 
      let committedParagraphs = []; 
      let renderPending = false;

      function resetCanvas() {
        committedParagraphs = [];
        committedSpan.innerText = "";
        interimSpan.innerText = "";
        textbox.scrollTop = 0;
      }

      // UI Template Engine: Renders stored elements safely into your layout view
      function updateHistoryDisplay() {
        try {
          const data = localStorage.getItem('objednavky');
          const orders = data ? JSON.parse(data) : [];
          
          if (orders.length === 0) {
            ordersLog.innerHTML = '<div class="no-orders">Žádné uložené objednávky.</div>';
            return;
          }

          // Reverse array sorting so freshest logs appear first at top
          ordersLog.innerHTML = orders.reverse().map(order => {
            const dateObj = new Date(order.timestamp);
            const timeFormatted = dateObj.toLocaleTimeString('cs-CZ', {hour: '2-digit', minute:'2-digit'});
            const dateFormatted = dateObj.toLocaleDateString('cs-CZ', {day: 'numeric', month: 'numeric'});
            
            return `
              <div class="order-item">
                <div class="order-meta">
                  <span>📅 ${dateFormatted} v ${timeFormatted}</span>
                  <span>ID: ${order.id.substring(0, 5)}...</span>
                </div>
                <div class="order-text">${escapeHtml(order.text)}</div>
              </div>
            `;
          }).join('');
        } catch (e) {
          console.error("Failed rendering log module UI layout:", e);
        }
      }

      // Basic protection layer converting string layouts safely to raw elements
      function escapeHtml(text) {
        return text
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function saveOrderToStorage(textPayload) {
        if (!textPayload.trim()) return false;
        
        try {
          const historicalData = localStorage.getItem('objednavky');
          const ordersList = historicalData ? JSON.parse(historicalData) : [];
          
          const newOrderEntry = {
            id: crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).substring(2, 11),
            timestamp: new Date().toISOString(),
            text: textPayload
          };
          
          ordersList.push(newOrderEntry);
          localStorage.setItem('objednavky', JSON.stringify(ordersList));
          
          // Re-render immediately on successful storage save
          updateHistoryDisplay();
          return true;
        } catch (error) {
          console.error("Storage write error:", error);
          return false;
        }
      }

      function initRecognition() {
        recognition = new SpeechRecognition();
        recognition.continuous = true; 
        recognition.interimResults = true; 
        recognition.lang = 'cs-CZ'; 

        recognition.onstart = async () => {
          status.innerText = "Poslouchám (cs-CZ)...";
          status.style.color = "#10b981";
          actionBtn.innerText = "Zastavit nahrávání";
          actionBtn.classList.add('recording');
          await requestWakeLock();
        };

        recognition.onend = () => {
          if (shouldBeRecording) {
            console.log("Stream dropped by browser timeout. Reinforcing listener loop...");
            try {
              initRecognition();
              recognition.start();
            } catch (err) {
              setTimeout(() => { if (shouldBeRecording) recognition.start(); }, 300);
            }
          } else {
            status.innerText = "Nahrávání zastaveno.";
            status.style.color = "#6b7280";
            actionBtn.innerText = "Spustit nahrávání";
            actionBtn.classList.remove('recording');
            releaseWakeLock();
            interimSpan.innerText = ""; 
          }
        };

        recognition.onresult = (event) => {
          let interimTranscript = '';
          let startIdx = event.resultIndex;

          for (let i = startIdx; i < event.results.length; ++i) {
            const resultChunk = event.results[i];
            
            if (resultChunk[0].confidence === 0 && resultChunk.isFinal) {
              continue;
            }

            const textSnippet = resultChunk[0].transcript.trim();

            if (resultChunk.isFinal && textSnippet) {
              const cleanSnippet = textSnippet.toLowerCase().replace(/[\s.,\/#!$%\^&\*;:{}=\-_`~()]/g,"");
              
              if (cleanSnippet === "nováobjednávka") {
                status.innerText = "Nová objednávka inicializována...";
                status.style.color = "#3b82f6";
                resetCanvas();
                interimTranscript = "";
                continue; 
              }

              if (cleanSnippet === "uložitobjednávku") {
                const finalAssembledText = committedParagraphs.join(' ').trim();
                
                if (finalAssembledText) {
                  const wasSaved = saveOrderToStorage(finalAssembledText);
                  if (wasSaved) {
                    status.innerText = "Objednávka byla úspěšně uložena! ✔";
                    status.style.color = "#10b981";
                  } else {
                    status.innerText = "Chyba při ukládání do paměti.";
                    status.style.color = "#ef4444";
                  }
                } else {
                  status.innerText = "Nelze uložit prázdný text.";
                  status.style.color = "#f59e0b";
                }
                
                resetCanvas();
                interimTranscript = "";
                continue;
              }

              let isGhostDuplicate = false;
              const lookbackWindow = committedParagraphs.slice(-3); 
              
              for (let pastSentence of lookbackWindow) {
                if (getSimilarity(pastSentence, textSnippet) > 0.85) {
                  isGhostDuplicate = true;
                  break;
                }
              }

              if (!isGhostDuplicate) {
                committedParagraphs.push(textSnippet);
              } else {
                console.warn("Blocked Browser Ghost Duplicate: ", textSnippet);
              }
            } else if (!resultChunk.isFinal) {
              const liveCleanInterim = resultChunk[0].transcript.toLowerCase().replace(/[\s.,\/#!$%\^&\*;:{}=\-_`~()]/g,"");
              if (liveCleanInterim === "nováobjednávka" || liveCleanInterim === "uložitobjednávku") {
                interimTranscript = "";
                continue;
              }
              interimTranscript += resultChunk[0].transcript;
            }
          }

          if (!renderPending) {
            renderPending = true;
            requestAnimationFrame(() => {
              const finalAssembledText = committedParagraphs.join(' ');
              committedSpan.innerText = finalAssembledText + (finalAssembledText ? ' ' : '');
              interimSpan.innerText = interimTranscript;
              textbox.scrollTop = textbox.scrollHeight;
              renderPending = false;
              
              if (shouldBeRecording && (status.innerText.includes("Nová") || status.innerText.includes("uložena") || status.innerText.includes("Nelze") || status.innerText.includes("Chyba"))) {
                setTimeout(() => {
                  if (shouldBeRecording) {
                    status.innerText = "Poslouchám (cs-CZ)...";
                    status.style.color = "#10b981";
                  }
                }, 2000);
              }
            });
          }
        };
        
        recognition.onerror = (event) => {
          console.error("Speech Recognition System Error:", event.error);
          if (event.error === 'no-speech') return;
        };
      }

      async function requestWakeLock() {
        if ('wakeLock' in navigator && !wakeLock) {
          try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
        }
      }

      function releaseWakeLock() {
        if (wakeLock) { 
          wakeLock.release().then(() => { wakeLock = null; }); 
        }
      }

      document.addEventListener('visibilitychange', async () => {
        if (wakeLock !== null && document.visibilityState === 'visible' && shouldBeRecording) {
          await requestWakeLock();
        }
      });

      function getSimilarity(str1, str2) {
        const s1 = str1.toLowerCase().replace(/[\s.,\/#!$%\^&\*;:{}=\-_`~()]/g,"");
        const s2 = str2.toLowerCase().replace(/[\s.,\/#!$%\^&\*;:{}=\-_`~()]/g,"");
        if (s1 === s2) return 1.0;
        if (!s1 || !s2) return 0.0;
        if (s1.includes(s2) && s1.length < s2.length + 5) return 0.9;
        if (s2.includes(s1) && s2.length < s1.length + 5) return 0.9;
        return 0.0;
      }

      initRecognition();
      
      // Load and display previous sessions' orders instantly upon app start
      updateHistoryDisplay();

      actionBtn.addEventListener('click', () => {
        if (!shouldBeRecording) {
          shouldBeRecording = true;
          
          const initialCleanText = committedSpan.innerText.trim() || textbox.innerText.replace(interimSpan.innerText, "").trim();
          if (initialCleanText) {
            committedParagraphs = [initialCleanText];
          } else {
            committedParagraphs = [];
          }
          
          recognition.start();
        } else {
          shouldBeRecording = false; 
          recognition.stop();
        }
      });
    }
  </script>
</body>
</html>
