<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receipt OCR Engine</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #e74c3c;
            --bg: #ecf0f1;
        }
        body { 
            font-family: system-ui, sans-serif; 
            background-color: var(--bg);
            color: var(--primary);
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        input[type="file"] { display: none; }
        .btn-upload {
            display: inline-block;
            background-color: var(--primary);
            color: white;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: opacity 0.2s;
        }
        .btn-upload:hover { opacity: 0.9; }
        
        .preview-area {
            margin: 20px 0;
            max-height: 400px;
            overflow: hidden;
            border-radius: 8px;
            border: 2px dashed #bdc3c7;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f8f9fa;
        }
        .preview-area img {
            max-width: 100%;
            max-height: 400px;
            object-fit: contain;
            display: none; /* Hidden until image is uploaded */
        }

        .status {
            font-size: 18px;
            font-weight: bold;
            color: var(--secondary);
            margin: 15px 0;
        }

        .results-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            text-align: left;
        }

        .card {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            padding: 15px;
            border-radius: 8px;
        }

        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 14px;
            color: #333;
            background: #fff;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
            max-height: 300px;
            overflow-y: auto;
        }

        .highlight {
            font-size: 24px;
            color: #27ae60;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Receipt Scanner</h1>
        <p>Powered by Tesseract.js (Machine Learning)</p>
        
        <input type="file" id="imageInput" accept="image/jpeg, image/png">
        <label for="imageInput" class="btn-upload">📁 Upload Receipt Photo</label>

        <div class="preview-area">
            <img id="imagePreview" alt="Receipt Preview">
        </div>

        <div id="status" class="status">Waiting for image...</div>

        <div class="results-grid">
            <div class="card">
                <h3>Extracted Data</h3>
                <p><strong>Total Price:</strong> <span id="totalPrice" class="highlight">--</span></p>
            </div>
            
            <div class="card">
                <h3>Raw Text Output</h3>
                <pre id="rawOutput">Raw text will appear here...</pre>
            </div>
        </div>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const imagePreview = document.getElementById('imagePreview');
        const statusText = document.getElementById('status');
        const rawOutput = document.getElementById('rawOutput');
        const totalPrice = document.getElementById('totalPrice');

        imageInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            // 1. Show the preview
            imagePreview.src = URL.createObjectURL(file);
            imagePreview.style.display = 'block';
            
            // 2. Reset UI
            statusText.textContent = "Loading AI Engine & Processing Image... (This takes a few seconds)";
            rawOutput.textContent = "";
            totalPrice.textContent = "--";

            try {
                // 3. Initialize Tesseract
                // We use 'ces' for Czech language to properly recognize č, ř, ž, etc.
                const worker = await Tesseract.createWorker('ces');
                
                // 4. Run the recognition
                const { data: { text } } = await worker.recognize(file);
                
                // 5. Output raw text
                rawOutput.textContent = text;
                statusText.textContent = "Scan Complete!";

                // 6. Data Parsing (Extracting specific info)
                // Look for the word "CELKEM" (Total) and grab the numbers after it
                const totalRegex = /CELKEM:\s*(\d+)\s*Kč/i;
                const match = text.match(totalRegex);

                if (match && match[1]) {
                    totalPrice.textContent = `${match[1]} Kč`;
                } else {
                    // Fallback to finding the word "Hotovost" (Cash)
                    const cashRegex = /Hotovost:\s*(\d+(?:,\d+)?)\s*Kč/i;
                    const cashMatch = text.match(cashRegex);
                    if (cashMatch && cashMatch[1]) {
                        totalPrice.textContent = `${cashMatch[1]} Kč`;
                    } else {
                        totalPrice.textContent = "Could not find total.";
                    }
                }

                await worker.terminate();

            } catch (error) {
                console.error(error);
                statusText.textContent = "An error occurred during scanning.";
            }
        });
    </script>
</body>
</html>
